# Esta página documenta a consulta paginada do histórico por carteira.
# Assinatura: Leonardo de Souza da Luz
openapi: 3.1.0
info:
  title: API de wagering distribuído
  version: 1.0.0
  description: >-
    Contrato da consulta paginada de transações persistidas da carteira. A API de
    demonstração não possui autenticação e deve permanecer limitada ao host local.
servers:
  - url: http://127.0.0.1:3000
    description: Instância local para demonstração
paths:
  /wallets/{walletId}/transactions:
    get:
      operationId: listarTransacoesDaCarteira
      summary: Lista o histórico persistido da carteira
      description: >-
        Consulta transações por carteira, da mais recente para a mais antiga.
        A operação é somente leitura e usa cursor opaco vinculado à carteira.
        O cursor não é uma assinatura criptográfica.
      parameters:
        - name: walletId
          in: path
          required: true
          description: Identificador UUID da carteira.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: Cursor opaco retornado pela página anterior.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Quantidade máxima de itens; o padrão é 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Página do histórico consultada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionsPage'
        '400':
          description: UUID, cursor ou limite inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Carteira inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Persistência temporariamente indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Falha interna inesperada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]{0,27})\.[0-9]{2}$'
          example: '80.00'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: BRL
    WalletTransaction:
      type: object
      required:
        - transactionId
        - providerId
        - externalTransactionId
        - playerId
        - walletId
        - roundId
        - gameId
        - kind
        - money
        - referenceExternalTransactionId
        - referenceTransactionId
        - status
        - failureCode
        - balance
        - createdAt
        - processedAt
      properties:
        transactionId:
          type: string
          format: uuid
        providerId:
          type: string
        externalTransactionId:
          type: string
        playerId:
          type: string
        walletId:
          type: string
          format: uuid
        roundId:
          type: string
        gameId:
          type: string
        kind:
          type: string
          enum: [OPENING, BET, WIN, LOSS, REFUND, ROLLBACK]
        money:
          $ref: '#/components/schemas/Money'
        referenceExternalTransactionId:
          type: [string, 'null']
        referenceTransactionId:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [PENDING, PENDING_REFERENCE, PROCESSED, REJECTED]
        failureCode:
          type: [string, 'null']
        balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: [string, 'null']
          format: date-time
    WalletTransactionsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
        nextCursor:
          type: [string, 'null']
    ApiError:
      type: object
      required: [statusCode, code, message]
      properties:
        statusCode:
          type: integer
        code:
          type: string
        message:
          type: string
